spring.application.name=digital-twin-backend
server.port=${PORT:8080}

# PostgreSQL
# Render Blueprint sets individual DB_HOST/DB_PORT/DB_NAME vars via fromDatabase.
# Local dev can override the full URL with SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digitaltwin}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jaimatadi}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway — owns all DDL; Hibernate maps entities but never alters the schema.
# baseline-on-migrate=true  → on an existing DB that has no flyway_schema_history
#   table yet, Flyway creates the table, baselines at version 0, then applies
#   V1 onwards.  V1 uses IF NOT EXISTS / DO-blocks so it is safe on those DBs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload storage directory
upload.dir=./uploads

# AES-256-GCM encryption for uploaded files at rest (bank statements, medical reports)
# Generate key: openssl rand -base64 32
file.encryption.key=${FILE_ENCRYPTION_KEY:}


# CORS — comma-separated list of allowed frontend origins.
# Defaults to localhost dev ports so the app works out of the box.
# For deployment, set the CORS_ALLOWED_ORIGINS env var to your real frontend URL:
#   CORS_ALLOWED_ORIGINS=https://your-app.vercel.app,https://your-custom-domain.com
# Wildcard (*) is intentionally NOT used as a default — browsers block credentialed
# requests (cookies/Authorization headers) when the server replies with Access-Control-Allow-Origin: *
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com,https://beyondselff.onrender.com}


# Groq AI
groq.api.key=${GROQ_API_KEY:}

# Fitbit OAuth (get credentials at https://dev.fitbit.com/apps/new)
# Redirect URI to register: http://localhost:8080/api/fitbit/callback
fitbit.client.id=${FITBIT_CLIENT_ID:}
fitbit.client.secret=${FITBIT_CLIENT_SECRET:}
fitbit.redirect.uri=${FITBIT_REDIRECT_URI:http://localhost:8080/api/fitbit/callback}
fitbit.frontend.url=${FITBIT_FRONTEND_URL:http://localhost:5173}

# Job APIs
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
jooble.api.key=${JOOBLE_API_KEY:}

# Plaid (https://dashboard.plaid.com/team/keys — use sandbox for dev)
plaid.client.id=${PLAID_CLIENT_ID:6a262928c10fd3000d8ce0a9}
plaid.secret=${PLAID_SECRET:37dc3bd9617cd0f950f96951f4a656}
plaid.env=${PLAID_ENV:sandbox}

# JWT
jwt.secret=${JWT_SECRET:beyondself-dev-jwt-secret-2025-stable-key-for-local-do-not-use-in-prod}
jwt.expiration=86400000

# Include exception messages in error responses so the frontend can show
# descriptive errors (e.g. "Invalid credentials" instead of "Unauthorized")
server.error.include-message=always
