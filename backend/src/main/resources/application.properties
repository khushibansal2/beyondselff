spring.application.name=digital-twin-backend
server.port=8080

# PostgreSQL Configuration
# Set these via environment variables or edit this file locally
# Never commit real credentials to git
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digitaltwin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload storage directory
upload.dir=./uploads

# CORS (allow React dev server on common ports)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:3000

# Gemini AI — set via environment variable (never hardcode)
gemini.api.key=${GEMINI_API_KEY:}
