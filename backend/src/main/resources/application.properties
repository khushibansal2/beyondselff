spring.application.name=digital-twin-backend
server.port=8080

# PostgreSQL (primary database)
spring.datasource.url=jdbc:postgresql://localhost:5432/digitaltwin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=gubbapavani
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload storage directory
upload.dir=./uploads

# CORS (allow React dev server)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176

