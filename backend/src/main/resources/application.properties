spring.application.name=digital-twin-backend
server.port=8080

# H2 in-memory database (no PostgreSQL required for dev)
spring.datasource.url=jdbc:h2:mem:digitaltwin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload storage directory
upload.dir=./uploads

# CORS (allow React dev server)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180

# Groq AI
groq.api.key=${GROQ_API_KEY}

# Job APIs (optional — free-tier Arbeitnow + Remotive work without these)
# Get Adzuna keys at https://developer.adzuna.com (free tier available)
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
# Get JSearch key at https://rapidapi.com/letscrape-6bRBa3QguO5/api/jsearch (free tier available)
jsearch.rapidapi.key=${JSEARCH_KEY:}

# JWT
jwt.secret=beyondself-hackathon-jwt-secret-key-2025-digitaltwin-secure
jwt.expiration=86400000
