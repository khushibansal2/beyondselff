spring.application.name=digital-twin-backend
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digitaltwin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jaimatadi}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload storage directory
upload.dir=./uploads

# AES-256-GCM encryption for uploaded files at rest (bank statements, medical reports)
# Generate key: openssl rand -base64 32
# If blank, files are stored unencrypted (dev fallback — set this in production)
file.encryption.key=${FILE_ENCRYPTION_KEY:}

# CORS (allow React dev server)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180

# Groq AI
groq.api.key=${GROQ_API_KEY:}

# Fitbit OAuth (get credentials at https://dev.fitbit.com/apps/new)
# Redirect URI to register: http://localhost:8080/api/fitbit/callback
fitbit.client.id=${FITBIT_CLIENT_ID:}
fitbit.client.secret=${FITBIT_CLIENT_SECRET:}
fitbit.redirect.uri=${FITBIT_REDIRECT_URI:http://localhost:8080/api/fitbit/callback}
fitbit.frontend.url=${FITBIT_FRONTEND_URL:http://localhost:5173}

# Job APIs
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
jooble.api.key=${JOOBLE_API_KEY:}

# JWT
jwt.secret=${JWT_SECRET:beyondself-hackathon-jwt-secret-key-2025-digitaltwin-secure}
jwt.expiration=86400000
