<script>
const sl = document.querySelectorAll('.slide');
let c = 0;
function go(d) {
  sl[c].classList.remove('active');
  c = ((c + d) % 2 + 2) % 2;
  sl[c].classList.add('active');
  document.getElementById('ctr').textContent = (c + 1) + ' / 2';
}
document.addEventListener('keydown', e => {
  if (['ArrowRight', ' '].includes(e.key)) { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
});
function resize() {
  const s = document.getElementById('scaler');
  const sc = Math.min(window.innerWidth / 1400, window.innerHeight / 900) * 0.98;
  s.style.transform = 'scale(' + sc + ')';
}
resize();
window.addEventListener('resize', resize);
</script>
